global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aiops-api
    static_configs:
      - targets: ["api:9900"]

  - job_name: aiops-workers
    static_configs:
      - targets: ["worker-1:9910", "worker-2:9910", "worker-3:9910"]

  - job_name: observability-stack
    metrics_path: /metrics
    static_configs:
      - targets: ["prometheus:9090", "loki:3100", "tempo:3200", "alloy:12345"]
